plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.zcz.beidan'
    compileSdk 34

    defaultConfig {
        applicationId 'com.zcz.beidan'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            def propsFile = file('/home/zcz/tools/keystore/beidan.properties')
            if (propsFile.exists()) {
                def props = new Properties()
                propsFile.withInputStream { props.load(it) }
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

/* 单一数据源：把项目根目录的 背单词.html 作为 assets/index.html 打包进 APK */
android.sourceSets.main.assets.srcDirs += ["$buildDir/generated/assets"]
tasks.register('copyAppHtml', Copy) {
    from(rootProject.file('../背单词.html')) { rename { 'index.html' } }
    into("$buildDir/generated/assets")
}
tasks.named('preBuild') { dependsOn 'copyAppHtml' }
