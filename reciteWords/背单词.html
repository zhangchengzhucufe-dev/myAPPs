<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f0dd">
<title>背单词</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f0dd; --card:#fffdf6; --card2:#fbf5e4; --ink:#43372a; --muted:#9a8b6d;
  --line:#e7dab6; --accent:#b3812f; --accent-ink:#fff; --accent-soft:#f2e6c2;
  --ok:#6b9353; --danger:#c0603f; --shadow:0 2px 12px rgba(140,110,50,.10); --radius:16px;
}
[data-theme="dark"]{
  --bg:#141210; --card:#211d17; --card2:#2a251d; --ink:#f0e8d6; --muted:#a2947c;
  --line:#3c352a; --accent:#d5a44e; --accent-ink:#221a0c; --accent-soft:#37301f;
  --ok:#8fb377; --danger:#d98a6d; --shadow:0 2px 12px rgba(0,0,0,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]){
    --bg:#141210; --card:#211d17; --card2:#2a251d; --ink:#f0e8d6; --muted:#a2947c;
    --line:#3c352a; --accent:#d5a44e; --accent-ink:#221a0c; --accent-soft:#37301f;
    --ok:#8fb377; --danger:#d98a6d; --shadow:0 2px 12px rgba(0,0,0,.45);
  }
}
html,body{height:100%}
body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
#app{max-width:900px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px}
header h1{font-size:22px;letter-spacing:1px}
#themeBtn{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:19px;cursor:pointer;color:var(--ink)}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:none;color:var(--muted);font-size:12px;padding:4px 0;cursor:pointer;position:relative;font-family:inherit}
#nav button .ic{font-size:20px;line-height:1.2}
#nav button.on{color:var(--accent);font-weight:600}
#nav .badge{position:absolute;top:0;right:calc(50% - 26px);background:var(--danger);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;line-height:16px;padding:0 4px;font-style:normal;text-align:center}
main{flex:1;padding:10px 16px calc(96px + env(safe-area-inset-bottom))}
@media(min-width:760px){
  #nav{position:static;border-top:none;background:transparent;padding:4px 16px 0;justify-content:flex-start;gap:4px}
  #nav button{flex:none;flex-direction:row;gap:6px;font-size:15px;padding:8px 14px;border-radius:10px}
  #nav button.on{background:var(--accent-soft)}
  #nav .badge{position:static;margin-left:2px}
  main{padding:16px 16px 48px}
  #toast{bottom:28px}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.card h2{font-size:17px;margin-bottom:10px}
.muted{color:var(--muted);font-size:13.5px}
.row{display:flex;align-items:center}.between{justify-content:space-between}.gap8{gap:8px}
.btn{appearance:none;border:none;background:var(--accent);color:var(--accent-ink);font-size:15.5px;padding:10px 18px;border-radius:12px;cursor:pointer;font-weight:600;font-family:inherit}
.btn:hover{filter:brightness(1.06)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);font-weight:500}
.btn.ok{background:var(--ok);color:#fff}
.btn.big{width:100%;padding:14px;font-size:17px}
.btnrow{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
input,textarea,select{width:100%;background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;color:var(--ink);font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
form label{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}
.bar{height:10px;background:var(--accent-soft);border-radius:5px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .3s}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.tile b{display:block;font-size:22px;color:var(--accent)}
.tile span{font-size:12.5px;color:var(--muted)}
.wordcard{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:30px 20px;text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none;margin:12px 0}
.wordcard .en{font-size:42px;font-weight:700;letter-spacing:.5px;word-break:break-word}
.wordcard .zh{font-size:20px;background:var(--accent-soft);padding:10px 18px;border-radius:12px;max-width:100%;word-break:break-word}
.wordcard .hint{color:var(--muted);font-size:14.5px;border:1.5px dashed var(--line);padding:8px 16px;border-radius:999px}
.dots{display:flex;gap:7px;justify-content:center;margin:14px 0;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--accent-soft);border:1px solid var(--line)}
.dots i.v{background:var(--accent);border-color:var(--accent)}
.navrow{display:flex;gap:12px;margin-top:6px}
.navrow .btn{flex:1}
.starbtn.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.kbd-hint{display:none;text-align:center;color:var(--muted);font-size:13px;margin-top:12px}
.kbd-hint kbd{background:var(--card2);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 7px;font-size:12px;margin:0 2px;font-family:inherit}
@media (hover:hover) and (pointer:fine){.kbd-hint{display:block}}
.fin{display:flex;gap:12px;margin-top:12px}.fin .btn{flex:1}
.count b{font-size:46px;color:var(--accent);margin-right:6px}
.tag{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--muted);white-space:nowrap}
.tag.ok{color:var(--ok)}
.wrow{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}
.wrow .wen{font-weight:600;min-width:0;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .wzh{flex:1;color:var(--muted);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon{background:none;border:none;cursor:pointer;font-size:16px;opacity:.55}.icon:hover{opacity:1}
.chart{display:flex;align-items:flex-end;gap:10px;height:130px;padding:6px 2px 0}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .bars{display:flex;gap:3px;align-items:flex-end;height:100%}
.chart .bars i{width:11px;border-radius:4px 4px 0 0;min-height:2px}
.chart .b1{background:var(--accent)}.chart .b2{background:var(--ok)}
.chart .dl{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.frow{padding:7px 2px;border-bottom:1px solid var(--line);font-size:14.5px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14.5px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:86vw;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
#modal.hidden{display:none}
#modal .mask{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#modal .box{position:relative;background:var(--card);border-radius:16px;padding:22px;max-width:440px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25);max-height:86vh;overflow:auto}
#modal h3{margin-bottom:10px}
.dupzh{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0 12px;word-break:break-word}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:9px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;font-size:14px;font-family:inherit}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
ul.help{padding-left:20px;display:grid;gap:6px;font-size:14px}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>📖 背单词</h1>
    <button id="themeBtn" data-action="theme-btn" title="切换浅色 / 夜间模式">🌗</button>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="toast"></div>
<div id="modal" class="hidden"><div class="mask" data-action="modal-close"></div><div class="box"></div></div>
<script>
'use strict';
/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const fmtDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr = () => fmtDate(new Date());
function diffDays(a, b){ // a - b，按日历天
  const [ay,am,ad] = a.split('-').map(Number), [by,bm,bd] = b.split('-').map(Number);
  return Math.round((Date.UTC(ay, am-1, ad) - Date.UTC(by, bm-1, bd)) / 864e5);
}
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'w' + Date.now() + Math.random().toString(36).slice(2);

/* ================= 示例词库 ================= */
const SAMPLE = [
["abandon","v. 放弃；抛弃"],["ability","n. 能力；才能"],["absorb","v. 吸收；使专心"],["abstract","adj. 抽象的 n. 摘要"],
["academic","adj. 学术的；学业的"],["accelerate","v. 加速；促进"],["access","n. 通道；使用权 v. 访问"],["accompany","v. 陪伴；伴随"],
["accomplish","v. 完成；实现"],["account","n. 账户；描述 v. 解释"],["accurate","adj. 准确的；精确的"],["achieve","v. 达到；实现"],
["acquire","v. 获得；习得"],["adapt","v. 适应；改编"],["adequate","adj. 足够的；适当的"],["adjust","v. 调整；适应"],
["admire","v. 钦佩；欣赏"],["adopt","v. 采用；收养"],["advance","v./n. 前进；进步"],["advantage","n. 优势；有利条件"],
["advocate","v. 提倡 n. 拥护者"],["affect","v. 影响；感动"],["afford","v. 负担得起；提供"],["aggressive","adj. 好斗的；有进取心的"],
["allocate","v. 分配；拨给"],["alter","v. 改变；更改"],["alternative","n. 替代方案 adj. 可替代的"],["ambition","n. 雄心；抱负"],
["analyze","v. 分析"],["announce","v. 宣布；声明"],["annual","adj. 每年的 n. 年刊"],["anticipate","v. 预期；期望"],
["anxiety","n. 焦虑；担忧"],["apparent","adj. 明显的；表面的"],["appreciate","v. 感激；欣赏"],["approach","n. 方法 v. 接近"],
["appropriate","adj. 恰当的；合适的"],["arouse","v. 唤起；激发"],["articulate","adj. 口齿清晰的 v. 清楚表达"],["assess","v. 评估；评定"]
];

/* ================= 数据与存储 ================= */
const LS = 'beidan.v1';
const OFFSETS = [0, 1, 3, 6]; // 复习节奏：T+0 背完当天 / T+1 / T+3 / T+6
const Z = { newGroups:0, newWords:0, reviewGroups:0, reviewWords:0 };
let state = load();
let session = null;        // { mode:'study'|'review', words:[...], idx, revealed:Set }
let editingId = null, pendingDelId = null, pendingImport = null;
let wordFilter = '';

function defaultState(){ return { version:1, words:[], settings:{ examDate:null, theme:'auto', serverAddr:'' }, daily:{}, times:[], deletedEns:[] }; }
function normalize(s){
  s.settings = Object.assign({ examDate:null, theme:'auto', serverAddr:'' }, s.settings || {});
  s.settings.serverAddr = String(s.settings.serverAddr || '').trim();
  // 删除墓碑：记录删除时间；词的 updatedAt 比删除晚（重新添加/编辑）则墓碑失效
  s.deletedEns = (Array.isArray(s.deletedEns) ? s.deletedEns : []).map(x =>
    typeof x === 'string' ? { en: x.trim().toLowerCase(), at: 0 }
      : { en: String((x && x.en) || '').trim().toLowerCase(), at: Number(x && x.at) || 0 }
  ).filter(x => x.en);
  { const dm = new Map(); s.deletedEns.forEach(x => { const p = dm.get(x.en); if(!p || x.at > p.at) dm.set(x.en, x); }); s.deletedEns = [...dm.values()]; }
  s.daily = s.daily || {};
  s.times = (Array.isArray(s.times) ? s.times : []).filter(x => x && typeof x.seconds === 'number').map(x => ({
    date: String(x.date || todayStr()), seconds: x.seconds,
    mode: ['study','review','restudy'].indexOf(x.mode) >= 0 ? x.mode : 'study',
    starOnly: !!x.starOnly, words: Number(x.words) || 0, at: Number(x.at) || 0
  }));
  s.words = (s.words || []).map(w => ({
    id: w.id || uid(),
    en: String(w.en || ''), zh: String(w.zh || ''),
    createdAt: w.createdAt || todayStr(),
    learnedAt: w.learnedAt || null,
    star: !!w.star,
    updatedAt: Number(w.updatedAt) || 0,
    reviewDone: (function(){
      const rd = Array.isArray(w.reviewDone) ? w.reviewDone.filter(x => typeof x === 'boolean') : [];
      if(rd.length >= 4) return rd.slice(0, 4);      // 新数据：T+0/1/3/6 四阶段
      while(rd.length < 3) rd.push(false);           // 旧数据：三阶段 [T+1,T+3,T+6]
      const t0 = !w.learnedAt || diffDays(todayStr(), w.learnedAt) >= 1; // 旧词的 T+0 当天已过 → 视为已完成，避免全部涌入复习队列
      return [t0, rd[0], rd[1], rd[2]];
    })()
  }));
  return s;
}
function load(){
  try{ const s = JSON.parse(localStorage.getItem(LS)); if(s && Array.isArray(s.words)) return normalize(s); }catch(_){}
  return defaultState();
}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){ toast('保存失败：浏览器存储不可用'); } if(SERVER) pushState(); }
function day(t){ const k = t || todayStr(); return state.daily[k] || (state.daily[k] = { newGroups:0, newWords:0, reviewGroups:0, reviewWords:0 }); }

/* ================= 主题 ================= */
function applyTheme(){ document.documentElement.dataset.theme = state.settings.theme; }
function effectiveDark(){
  return state.settings.theme === 'dark' ||
    (state.settings.theme === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
}

/* ================= 服务器同步模式 =================
   通过局域网服务器（sync-server.ps1）打开时自动启用：
   电脑与手机访问同一地址，共享同一份数据，实时同步。
   直接双击 HTML 文件（file://）时为本地模式，不受影响。 */
let SERVER = false, pushTimer = null;
function pushState(){
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => {
    fetch('/api/state', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(state) }).catch(() => {});
  }, 300);
}
function flushState(){ // 关闭页面 / 切走 / 关机前把最新状态立即写到服务器，防止最后一段进度丢失
  if(!SERVER) return;
  clearTimeout(pushTimer);
  try{ if(navigator.sendBeacon && navigator.sendBeacon('/api/state', new Blob([JSON.stringify(state)], { type:'application/json' }))) return; }catch(_){}
  try{ fetch('/api/state', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(state), keepalive:true }).catch(()=>{}); }catch(_){}
}
async function detectServer(){
  if(window.Beidan) return; // 手机APP：本地存储 + 主动同步，不走相对路径探测
  if(location.protocol !== 'http:' && location.protocol !== 'https:') return; // file:// 本地模式
  try{
    const r = await fetch('/api/state', { cache:'no-store' });
    if(r.status === 404){ SERVER = true; save(); }   // 服务器还没有数据 → 推送本机数据
    else if(r.ok){
      const s = await r.json();
      if(s && Array.isArray(s.words) && s.words.length){ state = mergeStates(state, normalize(s)); SERVER = true; save(); render(); } // 与本机合并，绝不用服务器数据覆盖本地
      else { SERVER = true; save(); }
    }
    if(SERVER){
      const l = document.createElement('link'); l.rel = 'manifest'; l.href = '/manifest.json'; document.head.appendChild(l);
      toast('已连接同步服务：电脑与手机数据实时共享');
    }
  }catch(_){ /* 连接失败 → 本地模式 */ }
}
/* 手机APP：数据线连接（adb reverse 端口映射）后，点按钮与电脑合并同步 */
/* 电脑地址：手机APP里可配置（如 192.168.1.5:8642）；留空 = 127.0.0.1:8642（数据线 adb reverse 端口映射） */
function syncBase(){
  const s = (state.settings.serverAddr || '').trim();
  const host = s.replace(/^https?:\/\//, '').replace(/\/+$/, '');
  return host ? 'http://' + host : 'http://127.0.0.1:8642';
}
function setKeepAwake(on){ try{ if(window.Beidan && Beidan.keepScreenOn) Beidan.keepScreenOn(!!on); }catch(_){} }
/* 手机APP：与电脑双向合并同步（同一 WiFi 直连，或数据线 adb reverse 后留空地址） */
async function usbSync(silent){
  const base = syncBase();
  let merged = false;
  try{
    const r = await fetch(base + '/api/state', { cache:'no-store' });
    if(!r.ok) throw new Error('empty');
    const s = await r.json();
    if(s && Array.isArray(s.words) && s.words.length){ state = mergeStates(state, normalize(s)); merged = true; }
    save();
    try{ await fetch(base + '/api/state', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(state) }); }catch(_){}
    if(!silent || merged) toast('同步完成：共 ' + state.words.length + ' 个单词');
    render();
  }catch(_){
    if(!silent) toast('同步失败：请确认电脑已双击运行「背单词.bat」、手机与电脑连同一个 WiFi、地址填写正确');
  }
}
window.beidanSync = function(silent){ usbSync(!!silent); }; // APP 启动时自动静默同步
/* APP 返回键：背诵中弹「退出本组？」确认框，弹窗开着就先关掉；其余交给系统退出 */
window.beidanBack = function(){
  if(!$('#modal').classList.contains('hidden')){ closeModal(); return 'handled'; }
  if(session && currentView === (session.mode === 'review' ? 'review' : 'study')){
    const q = document.querySelector('[data-action="quit"]');
    if(q){ q.click(); return 'handled'; }
  }
  return 'none';
};
/* APP 前后台切换：暂停时结算计时（与 visibilitychange 同一套逻辑，幂等可重复调用） */
window.beidanPause = function(){
  if(session && session.lastResume){ session.elapsed += Date.now() - session.lastResume; session.lastResume = 0; saveSession(); }
  flushState();
};
window.beidanResume = function(){ if(session && !session.lastResume) session.lastResume = Date.now(); };
/* 双击 HTML 文件打开（file://）时：若同步服务在运行，自动与服务器双向合并。
   老用户的历史存在浏览器 file:// 存储区，与 http 地址互不相通，靠这一步迁移合并；以后两个入口随便用哪个都同步。 */
async function localSync(){
  try{
    const r = await fetch('http://127.0.0.1:8642/api/state', { cache:'no-store' });
    if(!r.ok) return;
    const s = await r.json();
    if(!(s && Array.isArray(s.words))) return;
    const before = JSON.stringify(state);
    state = mergeStates(state, normalize(s));
    save();
    if(JSON.stringify(state) !== before) render();
    fetch('http://127.0.0.1:8642/api/state', { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(state) }).catch(()=>{});
  }catch(_){ /* 同步服务未运行，静默跳过 */ }
}

/* 定期拉取：手机 APP 同步后，电脑端 20 秒内自动合并显示，无需刷新页面 */
async function pullServer(){
  if(!SERVER || document.hidden) return;
  const tag = document.activeElement && document.activeElement.tagName; // 正在输入时不打断
  if(tag === 'INPUT' || tag === 'TEXTAREA') return;
  try{
    const r = await fetch('/api/state', { cache:'no-store' });
    if(!r.ok) return;
    const s = await r.json();
    if(!(s && Array.isArray(s.words))) return;
    const before = JSON.stringify(state);
    state = mergeStates(state, normalize(s));
    if(JSON.stringify(state) !== before){ save(); render(); toast('已同步手机端的最新进度'); }
  }catch(_){}
}
setInterval(pullServer, 20000);

/* ================= 计划与复习推导 ================= */
const unlearnedWords = () => state.words.filter(w => !w.learnedAt);
function plan(){
  const un = unlearnedWords().length;
  const exam = state.settings.examDate;
  if(!exam) return { daysLeft:null, unlearned:un };
  const dl = diffDays(exam, todayStr());
  if(dl < 0) return { daysLeft:dl, unlearned:un, expired:true };
  if(dl === 0) return { daysLeft:0, unlearned:un, dailyNew:un, groups:Math.ceil(un/10) };
  const dn = Math.ceil(un / dl); // 剩余词数 ÷ 剩余天数，向上取整保证考完前学完
  return { daysLeft:dl, unlearned:un, dailyNew:dn, groups:Math.ceil(dn/10) };
}
function isDue(w, t){
  if(!w.learnedAt) return false;
  const d = diffDays(t || todayStr(), w.learnedAt);
  return w.reviewDone.some((done, i) => !done && d >= OFFSETS[i]);
}
const dueWords = (t) => state.words.filter(w => isDue(w, t));

/* ================= 背诵 / 复习会话 ================= */
/* 会话持久化：中途退出再打开仍是同一组，点完成后才换下一组 */
function saveSession(){
  try{
    if(!session){ localStorage.removeItem(LS + '.session'); return; }
    localStorage.setItem(LS + '.session', JSON.stringify({
      mode: session.mode, starOnly: !!session.starOnly,
      ids: session.words.map(w => w.id), idx: session.idx, revealed: !!session.revealed,
      elapsed: session.elapsed || 0
    }));
  }catch(_){}
}
function loadSession(){
  try{
    const s = JSON.parse(localStorage.getItem(LS + '.session'));
    if(!s || ['study','review','restudy'].indexOf(s.mode) < 0 || !Array.isArray(s.ids) || !s.ids.length) return null;
    const words = s.ids.map(id => state.words.find(w => w.id === id)).filter(Boolean);
    if(!words.length) return null;
    // 计时继续（离线期间不计入）
    return { mode:s.mode, starOnly:!!s.starOnly, words, idx:Math.max(0, Math.min(words.length-1, s.idx || 0)), revealed:!!s.revealed, elapsed:s.elapsed || 0, lastResume:Date.now() };
  }catch(_){ return null; }
}
function startStudy(){
  if(session && session.mode === 'study'){ go('study'); return; } // 已有未完成的组 → 继续这一组，不重抽
  const pool = shuffle(unlearnedWords());
  if(!pool.length){ toast('词库中没有待学的新词，请先到「导入」添加'); return; }
  session = { mode:'study', words:pool.slice(0,10), idx:0, revealed:false, elapsed:0, lastResume:Date.now() };
  saveSession();
  go('study');
}
function startReview(starOnly){
  if(session && session.mode === 'review'){ go('review'); return; }
  const pool = shuffle(dueWords().filter(w => !starOnly || w.star));
  if(!pool.length){ toast(starOnly ? '今天到期的单词里还没有重点单词' : '今天没有到期的复习单词 🎉'); return; }
  session = { mode:'review', starOnly:!!starOnly, words:pool.slice(0,10), idx:0, revealed:false, elapsed:0, lastResume:Date.now() };
  saveSession();
  go('review');
}
function startRestudy(starOnly){
  if(session && session.mode === 'restudy'){ go('study'); return; }
  const pool = shuffle(state.words.filter(w => w.learnedAt === todayStr() && (!starOnly || w.star)));
  if(!pool.length){ toast(starOnly ? '今天背过的新词里还没有重点单词' : '今天还没有背过新词，先完成一组背诵吧'); return; }
  session = { mode:'restudy', starOnly:!!starOnly, words:pool, idx:0, revealed:false, elapsed:0, lastResume:Date.now() };
  saveSession();
  go('study');
}
function moveSession(d){ if(!session) return; session.idx = Math.max(0, Math.min(session.words.length-1, session.idx + d)); session.revealed = false; saveSession(); render(); }
function toggleReveal(){
  if(!session) return;
  session.revealed = !session.revealed; // 只对当前词生效，切走再回来时重新隐藏
  saveSession(); render();
}
function toggleStar(){
  if(!session) return;
  const w = state.words.find(v => v.id === session.words[session.idx].id);
  if(!w) return;
  w.star = !w.star; save(); render();
  toast(w.star ? `已标记「${w.en}」为重点单词 ★` : `已取消「${w.en}」的重点标记`);
}
function restartSession(){ if(!session) return; session.idx = 0; session.revealed = false; saveSession(); render(); }
function finishSession(){
  const t = todayStr(), n = session.words.length;
  // 计时结算：只累计页面可见的时间
  if(session.lastResume){ session.elapsed += Date.now() - session.lastResume; session.lastResume = 0; }
  const rec = { date:t, seconds:Math.max(1, Math.round((session.elapsed || 0) / 1000)), mode:session.mode, starOnly:!!session.starOnly, words:n, at:Date.now() };
  if(session.mode === 'restudy'){
    session = null; saveSession(); state.times.push(rec); save(); go('home');
    toast(`已重背今日 ${n} 个新词，加油！`);
    showTimeReport(rec.at);
    return;
  }
  if(session.mode === 'study'){
    session.words.forEach(w => {
      const x = state.words.find(v => v.id === w.id);
      if(x && !x.learnedAt){ x.learnedAt = t; x.reviewDone = [false,false,false,false]; }
    });
    const d = day(t); d.newGroups++; d.newWords += n;
    toast(`完成一组背诵，新学 ${n} 词！今天及第 1、3、6 天均可复习`);
  }else{
    session.words.forEach(w => {
      const x = state.words.find(v => v.id === w.id);
      if(!x || !x.learnedAt) return;
      const dd = diffDays(t, x.learnedAt);
      for(let i=0;i<OFFSETS.length;i++) if(!x.reviewDone[i] && dd >= OFFSETS[i]) x.reviewDone[i] = true; // 已到期的阶段一次清掉，当天不再出现
    });
    const d = day(t); d.reviewGroups++; d.reviewWords += n;
    toast(`复习完成 ${n} 词，今天不会再出现它们了！`);
  }
  session = null; saveSession(); state.times.push(rec); save(); go('home');
  showTimeReport(rec.at);
}

/* ================= 用时计时与排名 ================= */
function fmtDur(s){ s = Math.round(s); return s < 60 ? s + ' 秒' : Math.floor(s/60) + ' 分 ' + (s % 60) + ' 秒'; }
function fmtClock(ts){ const x = new Date(ts); return pad(x.getHours()) + ':' + pad(x.getMinutes()); }
function modeName(x){ return x.mode === 'study' ? '背诵新词' : x.mode === 'review' ? (x.starOnly ? '复习重点' : '复习') : (x.starOnly ? '重背重点' : '重背'); }
const sameCat = (x, m) => (x.mode === 'review') === (m === 'review'); // 背诵（新词/重背）与复习是两类，排名互不混合
const catName = m => m === 'review' ? '复习' : '背诵';
function rankInfo(rec, list){ // list 包含 rec 本身；用时短的名次靠前
  const sorted = [...list].sort((a,b) => a.seconds - b.seconds || a.at - b.at);
  const rank = sorted.findIndex(x => x.at === rec.at) + 1;
  return { rank, total: sorted.length, pct: Math.ceil(rank / sorted.length * 100) };
}
function showTimeReport(at){
  const rec = state.times.find(x => x.at === at);
  if(!rec) return;
  const cn = catName(rec.mode);
  const today = state.times.filter(x => x.date === rec.date && sameCat(x, rec.mode));
  const hist = state.times.filter(x => sameCat(x, rec.mode));
  const row = (x, cur) => `<div class="frow row between"${cur ? ' style="background:var(--accent-soft);border-radius:8px;padding:7px 8px"' : ''}><span>${(x.date === todayStr() ? '' : x.date.slice(5) + ' ') + fmtClock(x.at)} · ${x.words} 词</span><b${cur ? ' style="color:var(--accent)"' : ''}>${fmtDur(x.seconds)}${cur ? ' ← 本次' : ''}</b></div>`;
  const col = (list, label) => { // 只显示本次上、下相邻的名次，量大了也不刷屏
    const sorted = [...list].sort((a,b) => a.seconds - b.seconds || a.at - b.at);
    const r = rankInfo(rec, list), idx = r.rank - 1;
    const above = idx > 0 ? row(sorted[idx - 1]) : '';
    const below = idx < sorted.length - 1 ? row(sorted[idx + 1]) : '';
    const more = [];
    if(idx > 1) more.push(`上还有 ${idx - 1} 条更快`);
    if(idx < sorted.length - 2) more.push(`下还有 ${sorted.length - idx - 2} 条更慢`);
    return `<div>
      <label>${label}</label>
      <p class="muted" style="margin:4px 0 6px">第 <b style="color:var(--accent)">${r.rank}</b> / ${r.total} 名（前 ${r.pct}%）</p>
      ${above}${row(sorted[idx], true)}${below}
      ${more.length ? `<p class="muted" style="margin-top:6px">${more.join(' · ')}</p>` : ''}
    </div>`;
  };
  showModal(`<h3>⏱️ 本次${cn}用时 ${fmtDur(rec.seconds)}</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:2px 16px">
      ${col(today, `今日${cn}`)}
      ${col(hist, `历史${cn}`)}
    </div>
    <div class="btnrow"><button class="btn" data-action="modal-close">关闭</button></div>`);
}
function timesCard(){
  const t = todayStr();
  if(!state.times.length) return '<p class="muted">还没有用时记录。完成一组背诵 / 复习后会自动计时，并分别给出背诵和复习两个排名（互不混合）。</p>';
  const section = cn => {
    const m = cn === '复习' ? 'review' : 'study';
    const cat = state.times.filter(x => sameCat(x, m)).sort((a,b) => b.at - a.at);
    if(!cat.length) return '';
    const today = cat.filter(x => x.date === t).sort((a,b) => a.at - b.at);
    const totalSec = today.reduce((s,x) => s + x.seconds, 0);
    const best = Math.min(...cat.map(x => x.seconds));
    const avg = Math.round(cat.reduce((s,x) => s + x.seconds, 0) / cat.length);
    const todayRows = today.slice(-10).map(x => `<div class="frow row between"><span>${fmtClock(x.at)} · ${modeName(x)}（${x.words} 词）</span><b>${fmtDur(x.seconds)}</b></div>`).join('');
    const histRows = cat.slice(0, 10).map(x => `<div class="frow row between"><span>${x.date.slice(5)} ${fmtClock(x.at)} · ${modeName(x)}</span><b>${fmtDur(x.seconds)}</b></div>`).join('');
    return `<label style="margin-top:12px">${cn === '复习' ? '🔁' : '📝'} ${cn}用时</label>
      <p class="muted">今日合计 ${fmtDur(totalSec)}（${today.length} 组） · 历史最快 ${fmtDur(best)} · 平均 ${fmtDur(avg)}</p>
      <label style="margin-top:8px">今日各组用时</label>
      ${todayRows || '<p class="muted">今天还没有记录</p>'}
      ${today.length > 10 ? `<p class="muted">今天共 ${today.length} 组，仅显示最近 10 条</p>` : ''}
      <label style="margin-top:8px">历史最近 ${Math.min(10, cat.length)} 条</label>
      ${histRows}`;
  };
  return section('背诵') + section('复习');
}

/* ================= 导入 ================= */
function addWord(en, zh, ts){
  const k = en.trim().toLowerCase();
  state.deletedEns = (state.deletedEns || []).filter(x => x.en !== k); // 重新添加 → 墓碑失效
  state.words.push({ id:uid(), en, zh, createdAt:todayStr(), learnedAt:null, star:false, updatedAt: ts || Date.now(), reviewDone:[false,false,false,false] });
}
function findWord(en){ const k = en.trim().toLowerCase(); return state.words.find(w => w.en.trim().toLowerCase() === k); }
function onImportForm(f){
  const en = f.en.value.trim(), zh = f.zh.value.trim();
  if(!en){ toast('请输入英文单词'); return; }
  const ex = findWord(en);
  if(ex){ // 重复：弹出已存储提示 + 是否补充释义
    showModal(`<h3>「${esc(ex.en)}」已经存储过了</h3>
      <p class="muted">当前存储的中文释义：</p>
      <div class="dupzh">${esc(ex.zh) || '<span class="muted">（空）</span>'}</div>
      <p>是否补充 / 修改它的中文意思？</p>
      <div class="btnrow">
        <button class="btn ghost" data-action="modal-close">取消</button>
        <button class="btn" data-action="dup-edit" data-id="${ex.id}">补充释义</button>
      </div>`);
    return;
  }
  addWord(en, zh); save(); render();
  toast(`已添加「${en}」${zh ? '' : '（释义为空，可之后补充）'}`);
}
function openEditModal(w){
  editingId = w.id;
  showModal(`<h3>补充 / 修改释义</h3>
    <p class="muted">单词：${esc(w.en)}</p>
    <textarea id="dupZh" rows="3" style="margin-top:8px" placeholder="输入中文释义">${esc(w.zh)}</textarea>
    <div class="btnrow">
      <button class="btn ghost" data-action="modal-close">取消</button>
      <button class="btn" data-action="dup-save">保存</button>
    </div>`);
}
function onBatchForm(f){
  const lines = f.batch.value.split(/\n+/);
  let add = 0, skip = 0;
  lines.forEach(l => {
    l = l.trim(); if(!l) return;
    const m = l.match(/^([^,，＝:=\t]+)(?:[,，＝:=\t](.*))?$/);
    const en = (m ? m[1] : l).trim(), zh = (m && m[2] ? m[2] : '').trim();
    if(!en) return;
    if(findWord(en)){ skip++; return; }
    addWord(en, zh); add++;
  });
  save(); render();
  toast(add ? `批量导入完成：新增 ${add} 个${skip ? `，跳过重复 ${skip} 个` : ''}` : '没有可导入的内容');
}

/* ---- 双设备合并：按英文识别同一个词，两边记录都保留 ---- */
function mergeWord(a, b){
  const na = Number(a.updatedAt) || 0, nb = Number(b.updatedAt) || 0;
  const newer = nb > na ? b : a, older = newer === a ? b : a;
  const learned = [a.learnedAt, b.learnedAt].filter(Boolean).sort()[0] || null; // 取更早的学习日期（真实首次学习时间）
  const created = [a.createdAt, b.createdAt].filter(Boolean).sort()[0] || todayStr();
  return {
    id: newer.id || older.id || uid(),
    en: newer.en || older.en,
    zh: (newer.zh || '').trim() ? newer.zh : (older.zh || ''), // 释义取最近编辑的；编辑后为空则保留旧释义
    createdAt: created,
    learnedAt: learned,
    star: !!(a.star || b.star), // 任一设备标了重点就保留
    updatedAt: Math.max(na, nb),
    reviewDone: [0, 1, 2, 3].map(i => !!(a.reviewDone[i] || b.reviewDone[i])) // 复习进度取并集
  };
}
function mergeStates(local, incoming){
  const map = new Map();
  const put = w => {
    const k = (w.en || '').trim().toLowerCase();
    if(!k) return;
    map.set(k, map.has(k) ? mergeWord(map.get(k), w) : w);
  };
  local.words.forEach(put);
  incoming.words.forEach(put);
  const merged = defaultState();
  { // 删除墓碑合并：同一词取更晚的删除时间；词本身比删除晚 → 词赢，墓碑作废
    const dm = new Map();
    [...(local.deletedEns || []), ...(incoming.deletedEns || [])].forEach(x => {
      const p = dm.get(x.en); if(!p || (x.at || 0) > (p.at || 0)) dm.set(x.en, x);
    });
    merged.words = [...map.values()].filter(w => {
      const d = dm.get((w.en || '').trim().toLowerCase());
      return !(d && (d.at || 0) >= (Number(w.updatedAt) || 0));
    });
    merged.deletedEns = [...dm.values()].filter(d => !merged.words.some(w => (w.en || '').trim().toLowerCase() === d.en));
  }
  new Set([...Object.keys(local.daily || {}), ...Object.keys(incoming.daily || {})]).forEach(d => {
    const a = local.daily[d] || Z, b = incoming.daily[d] || Z;
    merged.daily[d] = {
      newGroups: Math.max(a.newGroups || 0, b.newGroups || 0),
      newWords: Math.max(a.newWords || 0, b.newWords || 0),
      reviewGroups: Math.max(a.reviewGroups || 0, b.reviewGroups || 0),
      reviewWords: Math.max(a.reviewWords || 0, b.reviewWords || 0)
    };
  });
  merged.settings.examDate = incoming.settings.examDate || local.settings.examDate || null;
  merged.settings.theme = local.settings.theme || 'auto'; // 外观是设备各自的偏好，不跟随备份
  merged.settings.serverAddr = local.settings.serverAddr || ''; // 电脑地址是本机设置，合并时必须保留
  const seenAt = new Set(); // 用时记录：两边都保留（按时间戳去重）
  merged.times = [...(local.times || []), ...(incoming.times || [])]
    .sort((a,b) => a.at - b.at)
    .filter(x => { if(seenAt.has(x.at)) return false; seenAt.add(x.at); return true; });
  return merged;
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action;
  switch(a){
    case 'nav': go(el.dataset.view); break;
    case 'theme-btn':
      state.settings.theme = effectiveDark() ? 'light' : 'dark';
      applyTheme(); save(); render();
      toast(state.settings.theme === 'dark' ? '已切换到夜间模式 🌙' : '已切换到浅色模式 ☀️');
      break;
    case 'theme-set':
      state.settings.theme = el.dataset.v; applyTheme(); save(); render(); break;
    case 'start-study': startStudy(); break;
    case 'start-review': startReview(el.dataset.star === '1'); break;
    case 'start-restudy': startRestudy(el.dataset.star === '1'); break;
    case 'star': toggleStar(); break;
    case 'prev': moveSession(-1); break;
    case 'next': moveSession(1); break;
    case 'reveal': toggleReveal(); break;
    case 'restart': restartSession(); break;
    case 'finish': finishSession(); break;
    case 'quit':
      showModal(`<h3>退出${session ? (session.mode === 'study' ? '背诵' : session.mode === 'review' ? '复习' : '重背') : '本次学习'}？</h3>
        <p class="muted">本组进度不会保存，单词状态不变。</p>
        <div class="btnrow">
          <button class="btn ghost" data-action="modal-close">继续学习</button>
          <button class="btn" data-action="quit-yes">确认退出</button>
        </div>`);
      break;
    case 'quit-yes': session = null; saveSession(); setKeepAwake(false); closeModal(); render(); break;
    case 'modal-close': closeModal(); break;
    case 'dup-edit': {
      const w = state.words.find(x => x.id === el.dataset.id);
      if(w) openEditModal(w);
      break;
    }
    case 'dup-save': {
      const w = state.words.find(x => x.id === editingId);
      if(w){ w.zh = $('#dupZh').value.trim(); w.updatedAt = Date.now(); save(); closeModal(); render(); toast('释义已更新'); }
      break;
    }
    case 'exam-clear': state.settings.examDate = null; save(); render(); toast('已清除考试日期'); break;
    case 'export': exportData(); break;
    case 'import-file': $('#importFile').click(); break;
    case 'import-merge':
      if(pendingImport){
        const before = state.words.length;
        state = mergeStates(state, pendingImport);
        pendingImport = null; applyTheme(); save(); session = null; saveSession(); closeModal(); go('home');
        toast(`合并完成：共 ${state.words.length} 个单词（本设备原有 ${before} 个）`);
      }
      break;
    case 'import-replace':
      if(pendingImport){ state = pendingImport; pendingImport = null; applyTheme(); save(); session = null; saveSession(); closeModal(); go('home'); toast('已覆盖导入'); }
      break;
    case 'usb-sync': usbSync(); break;
    case 'serveraddr-save':
      state.settings.serverAddr = ($('#serverAddr') ? $('#serverAddr').value : '') || '';
      save(); render(); toast('已保存电脑地址');
      break;
    case 'sample':
      showModal(`<h3>载入示例词库？</h3><p>将添加 ${SAMPLE.length} 个常用单词（英文重复的自动跳过）。</p>
        <div class="btnrow">
          <button class="btn ghost" data-action="modal-close">取消</button>
          <button class="btn" data-action="sample-yes">载入</button>
        </div>`);
      break;
    case 'sample-yes': {
      let n = 0;
      SAMPLE.forEach(([en, zh]) => { if(!findWord(en)){ addWord(en, zh); n++; } });
      save(); closeModal(); render(); toast(`已载入 ${n} 个示例单词`);
      break;
    }
    case 'wipe':
      showModal(`<h3>清空全部数据？</h3><p class="muted">将删除所有单词、学习进度和设置，且无法恢复。建议先导出备份。</p>
        <div class="btnrow">
          <button class="btn ghost" data-action="modal-close">取消</button>
          <button class="btn" data-action="wipe-yes" style="background:var(--danger);color:#fff">确认清空</button>
        </div>`);
      break;
    case 'wipe-yes':
      state = defaultState(); session = null; applyTheme(); saveSession(); save(); closeModal(); go('home'); toast('已清空全部数据');
      break;
    case 'word-del': {
      const w = state.words.find(x => x.id === el.dataset.id);
      if(!w) break;
      pendingDelId = w.id;
      showModal(`<h3>删除「${esc(w.en)}」？</h3><p class="muted">其学习与复习记录将一并删除。</p>
        <div class="btnrow">
          <button class="btn ghost" data-action="modal-close">取消</button>
          <button class="btn" data-action="del-yes" style="background:var(--danger);color:#fff">删除</button>
        </div>`);
      break;
    }
    case 'del-yes': {
      const w = state.words.find(x => x.id === pendingDelId);
      state.words = state.words.filter(x => x.id !== pendingDelId);
      const k = w ? (w.en || '').trim().toLowerCase() : '';
      if(k){ // 墓碑：同步后其它设备也会删除；重新添加（时间更晚）则自动失效
        const d = state.deletedEns.find(x => x.en === k);
        if(d) d.at = Date.now(); else state.deletedEns.push({ en: k, at: Date.now() });
      }
      pendingDelId = null; save(); closeModal(); render(); toast('已删除（同步后其它设备也会删除）');
      break;
    }
  }
});

});
document.addEventListener('change', e => {

document.addEventListener('keydown', e => {
  if(!$('#modal').classList.contains('hidden')) return;
  const tag = document.activeElement && document.activeElement.tagName;
  if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  const inSession = session && currentView === (session.mode === 'review' ? 'review' : 'study');
  if(!inSession) return;
  if(e.key === 'ArrowRight') moveSession(1);
  else if(e.key === 'ArrowLeft') moveSession(-1);
  else if(e.key === 'ArrowUp'){ e.preventDefault(); toggleReveal(); } // ↑ 显示/隐藏释义
  else if(e.key === 'ArrowDown'){ e.preventDefault(); restartSession(); } // ↓ 返回第一个词
  else if(e.key === 'Enter'){ e.preventDefault(); toggleStar(); } // 回车标记/取消重点
  // 不绑定 Alt 键：Alt+Tab 切换窗口时会误触"返回重来"
});
/* 计时：只累计页面可见的时间，切走/最小化暂停，关闭前保存 */
document.addEventListener('visibilitychange', () => {
  if(!session) return;
  if(document.hidden){
    if(session.lastResume){ session.elapsed += Date.now() - session.lastResume; session.lastResume = 0; saveSession(); }
    flushState();
  }else if(!session.lastResume){ session.lastResume = Date.now(); }
});
window.addEventListener('pagehide', () => {
  if(session && session.lastResume){ session.elapsed += Date.now() - session.lastResume; session.lastResume = Date.now(); saveSession(); }
  flushState();
});
setInterval(() => { if(session && session.lastResume && !document.hidden) saveSession(); }, 15000);
if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => render());

(function seedImportV2(){
  try{
    if(localStorage.getItem(LS + '.seed2')) return;
    let n = 0;
    // updatedAt=1：种子词是占位数据，任何真实编辑（或删除墓碑）在合并时都能压过它，避免新设备播种"复活"已删除的词
    SEED_V2.forEach(function(pair){ if(!findWord(pair[0])){ addWord(pair[0], pair[1], 1); n++; } });
    if(n){ save(); toast('已从截图词库导入 ' + n + ' 个新单词'); }
    localStorage.setItem(LS + '.seed2', '1');
  }catch(_){}
})();

applyTheme();
session = loadSession(); // 恢复上次未完成的组（同一组单词、同一进度）
if(session) setTimeout(() => toast('已恢复上次未完成的组，继续即可'), 600);
render();
detectServer(); // 通过局域网服务器打开时自动进入同步模式
if(location.protocol === 'file:') localSync(); // 双击 HTML 打开且同步服务在运行时，自动合并老数据
</script>
